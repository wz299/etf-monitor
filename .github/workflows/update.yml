name: Update ETF Dashboard

on:
  schedule:
    # 周一至周五 北京时间 08:30 更新美股收盘价 (UTC 00:30)
    - cron: '30 0 * * 1-5'
    # 周一至周五 北京时间 10:33, 10:43, 10:53 (UTC 02:33, 02:43, 02:53)
    - cron: '33,43,53 2 * * 1-5'
    # 周一至周五 北京时间 11:03, 11:13, 11:23, 11:33 (UTC 03:03-03:33)
    - cron: '3,13,23,33 3 * * 1-5'
    # 周一至周五 北京时间 13:03-14:53 每10分钟 (UTC 05:03-06:53)
    - cron: '3,13,23,33,43,53 5-6 * * 1-5'
    # 周一至周五 北京时间 15:03, 15:13 (UTC 07:03, 07:13)
    - cron: '3,13 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate index.html
        run: python update_etf_dashboard.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "chore: update ETF dashboard"
          git push
