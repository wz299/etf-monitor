name: Update ETF Dashboard

on:
  schedule:
    # 周一至周五 北京时间 09:30, 10:00, 10:30, 11:00, 11:30 (UTC 01:30-03:30)
    - cron: '30 1 * * 1-5'
    - cron: '0,30 2-3 * * 1-5'
    # 周一至周五 北京时间 13:00, 13:30, 14:00, 14:30, 15:00 (UTC 05:00-07:00)
    - cron: '0,30 5-6 * * 1-5'
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate index.html
        run: python update_etf_dashboard.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "chore: update ETF dashboard"
          git push
