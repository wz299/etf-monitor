name: Update ETF Dashboard

on:
  schedule:
    # 周一至周五 北京时间 10:00 更新美股收盘数据 (UTC 02:00)
    - cron: '0 2 * * 1-5'
    # 周一至周五 北京时间 10:30, 10:40, 10:50 (UTC 02:30-02:50)
    - cron: '30,40,50 2 * * 1-5'
    # 周一至周五 北京时间 11:00, 11:10, 11:20, 11:30 (UTC 03:00-03:30)
    - cron: '0,10,20,30 3 * * 1-5'
    # 周一至周五 北京时间 13:00-14:50 每10分钟 (UTC 05:00-06:50)
    - cron: '*/10 5-6 * * 1-5'
    # 周一至周五 北京时间 15:00, 15:10 (UTC 07:00, 07:10)
    - cron: '0,10 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate index.html
        run: python update_etf_dashboard.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "chore: update ETF dashboard"
          git push
